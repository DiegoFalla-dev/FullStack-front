<footer class="footer">
  <div class="footer__container">

    <!-- TOP: Brand + Links -->
    <div class="footer__top">

      <!-- Brand -->
      <div class="footer__brand">
        <a routerLink="/" class="footer__logo">
          Ticket<span class="footer__logo-accent">Flow</span>
        </a>
        <p class="footer__tagline">
          Tu próxima experiencia<br>te está esperando.
        </p>

        <!-- Socials -->
        <div class="footer__socials">
          <a
            *ngFor="let social of socials"
            [href]="social.url"
            target="_blank"
            rel="noopener noreferrer"
            class="footer__social-btn"
            [title]="social.label"
            [innerHTML]="social.icon"
          ></a>
        </div>
      </div>

      <!-- Nav columns -->
      <div class="footer__nav">
        <div class="footer__col" *ngFor="let group of links">
          <h4 class="footer__col-title">{{ group.title }}</h4>
          <ul class="footer__col-list">
            <li *ngFor="let item of group.items">
              <a
                [routerLink]="item.path"
                class="footer__col-link"
              >
                {{ item.label }}
              </a>
            </li>
          </ul>
        </div>
      </div>

    </div>

    <!-- DIVIDER -->
    <div class="footer__divider"></div>

    <!-- BOTTOM: Copyright + badges -->
    <div class="footer__bottom">
      <p class="footer__copy">
        © {{ currentYear }} TicketFlow. Todos los derechos reservados.
      </p>

      <div class="footer__badges">
        <span class="footer__badge">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/>
          </svg>
          Pago seguro
        </span>
        <span class="footer__badge">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
          Compra protegida
        </span>
        <span class="footer__badge">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
          Entradas 100% oficiales
        </span>
      </div>
    </div>

  </div>
</footer>
