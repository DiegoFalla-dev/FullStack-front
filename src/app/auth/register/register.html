<div class="register-container">
  <div class="register-card">
    <div class="register-header">
      <h1>TicketFlow</h1>
      <p>Crea tu cuenta</p>
    </div>

    <form class="register-form">
      <div class="form-row">
        <div class="form-group">
          <label for="firstName">Nombre</label>
          <input
            type="text"
            id="firstName"
            placeholder="Juan"
            class="form-input"
            required
          />
        </div>
        <div class="form-group">
          <label for="lastName">Apellido</label>
          <input
            type="text"
            id="lastName"
            placeholder="Pérez"
            class="form-input"
            required
          />
        </div>
      </div>

      <div class="form-group">
        <label for="registerEmail">Email</label>
        <input
          type="email"
          id="registerEmail"
          placeholder="tu@email.com"
          class="form-input"
          required
        />
      </div>

      <div class="form-group">
        <label for="phone">Teléfono</label>
        <input
          type="tel"
          id="phone"
          placeholder="+51 999 999 999"
          class="form-input"
        />
      </div>

      <div class="form-group">
        <label for="registerPassword">Contraseña</label>
        <input
          type="password"
          id="registerPassword"
          placeholder="••••••••"
          class="form-input"
          required
        />
        <p class="password-hint">Mínimo 8 caracteres</p>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirma tu contraseña</label>
        <input
          type="password"
          id="confirmPassword"
          placeholder="••••••••"
          class="form-input"
          required
        />
      </div>

      <label class="terms-label">
        <input type="checkbox" required />
        Acepto los
        <a href="#" class="terms-link">términos y condiciones</a>
      </label>

      <button type="submit" class="btn-register">Crear Cuenta</button>
    </form>

    <p class="login-link">
      ¿Ya tienes cuenta?
      <a routerLink="/auth/login">Inicia sesión aquí</a>
    </p>
  </div>
</div>
